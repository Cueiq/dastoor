[project]
name = "dastoor"
version = "0.1.0"
description = "Finds the grammar points an English sentence uses, by tested rules, and gives each one's note"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "spacy>=3.8,<3.9",
]

[project.scripts]
dastoor = "dastoor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The spaCy models, from their releases: groups, not dependencies, as a package
# on PyPI can't name a file by its URL. `uv sync` installs the small one;
# `uv sync --all-groups` the transformer too, which needs about 1 GB with
# PyTorch.
[dependency-groups]
sm = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
trf = [
    "spacy[transformers]>=3.8,<3.9",
    # Named here so the source below applies to it.
    "torch",
    "en-core-web-trf @ https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl",
]

[tool.uv]
default-groups = ["sm"]

# PyTorch for the CPU on Linux: the default build brings the GPU's libraries,
# gigabytes of them, which a parser doesn't use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
