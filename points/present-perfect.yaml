id: present-perfect
title: { en: "have / has + past participle", fa: "حال کامل / ماضی نقلی (have + اسم مفعول)" }
# What a learner may search it by, in English and Persian.
keywords: ["present perfect", "have done", "ever", "never", "already", "yet", "just", "حال کامل", "ماضی نقلی", "تجربه"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  timeline: { row: up-to-now }
topic: perfect
cefrj: ["62", "62-1", "62-2", "62-3"]
# The guides taught it as two points: a result, and an experience (ever).
aliases: [present-perfect-experience]
match:
  - form: have
    tree:
      # A past tense the parser hangs on have is its participle misread:
      # "Huh. Maybe it hasn't happened yet."
      word: { TAG: { IN: [VBN, VBD] }, LOWER: { NOT_IN: [got, gotten] } }
      # have as a finite verb: not "supposed to have been", "Better have
      # finished" (had better).
      has: [ { DEP: aux, LOWER: { IN: [have, has, "'ve", ve, haven't, hasn't] }, TAG: { IN: [VBP, VBZ] } } ]
      lacks:
        - { DEP: auxpass }
        - { DEP: aux, TAG: MD }
        - { DEP: aux, LOWER: been }
  # 's + participle is has or is; the parser calling 's a helper (not a
  # passive's) is taken as has, and been after 's is always has.
  - form: s
    tree:
      word: { TAG: VBN, LOWER: { NOT_IN: [got, gotten] } }
      has: [ { DEP: aux, LOWER: { IN: ["'s", s] } } ]
      lacks:
        - { DEP: auxpass }
        - { DEP: aux, TAG: MD }
  - form: s-been
    tree:
      word: { LOWER: been }
      has: [ { LOWER: { IN: ["'s", s] } } ]
      lacks: [ { DEP: aux, TAG: MD } ]
exclude:
  # (had) better have + past participle: a warning, not the present perfect.
  - tokens: [ { LOWER: better }, { LOWER: have } ]
tests:
  words: [have, has, "'ve", "haven't", "hasn't", been]
  match:
    - "I've seen it."
    - "Have you ever been to Paris?"
    - "I haven't been there."
    - "She has finished her homework."
    - "It's been a long day."
    - "Huh. Maybe it hasn't happened yet."
  no_match:
    - "I've got a car."
    - "I've got to go."
    - "It's done."
    - "You must have seen it."
    - "I've been waiting for an hour."
    - "It has been fixed."
    - "He was the me I was supposed to have been."
    - "Better have finished what?"

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), or Bembegoo's
# guides' where no item has one (guides).
level: B1
level_from: egp
note:
  gist:
    en: "Have or has + a past participle, for something done before now whose time isn't said: what you have done in your life (Have you ever been to London?), or what has happened with a result now (I've lost my keys)."
    fa: "ترکیب have یا has به‌علاوهٔ اسم مفعول (قسمت سوم فعل)، برای کاری است که پیش از زمان حال انجام شده اما زمان دقیقِ وقوع آن گفته نمی‌شود: مثل بیان تجربه‌های زندگی (Have you ever been to London؟) یا اتفاقی که در گذشته افتاده اما اثر یا نتیجه‌اش هم‌اکنون باقی است (I've lost my keys)."
  forms:
    - kind: positive
      text: I have seen this film.
      mark: have seen
    - kind: negative
      text: She hasn't finished her homework.
      mark: hasn't finished
    - kind: question
      text: Have you ever been to London?
      mark: Have you ever been
  mistakes:
    - wrong: I have seen him yesterday.
      right: I saw him yesterday.
      why:
        en: "With a finished time like yesterday, use the past simple."
        fa: "وقتی زمانِ مشخص و تمام‌شده‌ای مثل yesterday (دیروز) در جمله ذکر می‌شود، نباید از حال کامل استفاده کرد؛ بلکه باید سراغ گذشتهٔ ساده رفت."
    - wrong: Have you ever went to Rome?
      right: Have you ever been to Rome?
      why:
        en: "After have comes the past participle (been, seen), not the past (went, saw)."
        fa: "بعد از have یا has حتماً باید از اسم مفعول (قسمت سوم فعل مثل been یا seen) استفاده کنید، نه شکلِ گذشتهٔ ساده (مثل went یا saw)."
    - wrong: She have been to Paris.
      right: She has been to Paris.
      why:
        en: "He, she and it take has."
        fa: "ضمایر سوم‌شخص مفرد (he، she، it) با has همراه می‌شوند، نه have."
  contrast:
    - term: past simple
      example: I went to London last year.
      why:
        en: "The past simple says when; the present perfect doesn't."
        fa: "گذشتهٔ ساده زمانِ دقیقِ انجام کار را بیان می‌کند (چه زمانی؟)، اما حال کامل کاری با زمانِ دقیق ندارد و روی تجربه یا نتیجه تمرکز می‌کند."
    - term: have been + -ing
      example: I've been watching this show all week.
      why:
        en: "That one is an activity still going on."
        fa: "ساختار حال کامل استمراری (have been + ing) برای کاری است که از گذشته شروع شده و هنوز هم در حال ادامه داشتن است."
      point: present-perfect-continuous
exercises:
  - id: never-london
    kind: choose
    sentence: "I ___ never been to London."
    options:
      - have
      - has
      - am
    answer: have
    why:
      en: "I + have + past participle."
      fa: "ضمیر I با فعل کمکی have و سپس اسم مفعول می‌آید."
  - id: seen-yesterday
    kind: fix
    wrong: I have seen him yesterday.
    right:
      - I saw him yesterday.
    why:
      en: "Yesterday is a finished time: past simple."
      fa: "کلمهٔ yesterday نشان‌دهندهٔ زمانِ تمام‌شده در گذشته است و نیاز به گذشتهٔ ساده دارد."
  - id: ever-ride
    kind: rewrite
    instruction:
      en: "Ask with Have you ever…?"
      fa: "این جمله را به صورت یک پرسش دربارهٔ تجربه با Have you ever…? بنویسید."
    from: "Did you ride a horse at any time in your life?"
    answers:
      - "Have you ever ridden a horse?"
    why:
      en: "At any time in your life: have + ever + past participle."
      fa: "برای پرسیدن دربارهٔ تجربیات زندگی: Have you ever + اسم مفعول."