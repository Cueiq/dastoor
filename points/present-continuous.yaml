id: present-continuous
title: { en: "am / is / are + -ing", fa: "حال استمراری (am / is / are + -ing)" }
# What a learner may search it by, in English and Persian.
keywords: ["present continuous", "present progressive", "-ing", "حال استمراری", "دارم انجام می‌دهم"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  timeline: { row: ongoing, when: now }
topic: present
cefrj: ["61", "61-1", "61-2", "61-3"]
match:
  - form: all
    tree:
      word: { TAG: VBG }
      has: [ { DEP: { IN: [aux, auxpass] }, LOWER: { IN: [am, is, are, "'m", "'re", "'s", m, re, s, "isn't", "aren't"] } } ]
      lacks:
        # have been + -ing, and will be + -ing, are other points.
        - { DEP: aux, LOWER: { IN: [been, be] } }
        # going to + verb is be-going-to.
        - word: { DEP: xcomp }
          has: [ { DEP: aux, LOWER: { IN: [to, na] } } ]
  # It's raining: the small model may hang the -ing word on 's.
  - form: attr
    tree:
      word: { TAG: VBG, DEP: attr }
      head: { word: { LOWER: { IN: [am, is, are, "'m", "'re", "'s"] } } }
exclude:
  # all-knowing, good-looking: an adjective made with -ing, not a verb.
  - tokens: [ { TAG: HYPH }, { LOWER: { REGEX: "ing$" } } ]
  # gonna, which the parser may leave without its verb.
  - tokens: [ { LOWER: gon }, { LOWER: na } ]
tests:
  words: [ing]
  match:
    - "I'm sleeping."
    - "What are you doing?"
    - "She isn't listening."
    - "I'm leaving tomorrow."
    - "It's raining."
  no_match:
    - "I'm going to tell him."
    - "I've been waiting."
    - "I was sleeping."
    - "We're gonna die."
    - "I don't need to tell him. He's all-knowing."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), CEFR-J's own
# (cefrj), or Bembegoo's guides' where no item has one (guides).
level: A1
level_from: egp
note:
  gist:
    en: "Am, is or are + an -ing verb, for what is happening now (What are you doing?), or for a plan already arranged (I'm meeting Ali tomorrow)."
    fa: "استفاده از am، is یا به‌علاوهٔ یک فعلِ ingدار، برای بیان کاری است که همین حالا در حال انجام است (What are you doing؟) یا برنامه‌ای قطعی که از قبل برای آینده تدارک دیده شده است (I'm meeting Ali tomorrow)."
  forms:
    - kind: positive
      text: I'm reading a book.
      mark: "'m reading"
    - kind: negative
      text: She isn't sleeping.
      mark: isn't sleeping
    - kind: question
      text: What are you doing?
      mark: are you doing
    - kind: positive
      text: I'm meeting Ali tomorrow.
      mark: "'m meeting"
  mistakes:
    - wrong: What you doing?
      right: What are you doing?
      why:
        en: "Don't drop am, is or are."
        fa: "فعل‌های کمکی am، is یا are را قبل از فاعل و ing جا نیندازید."
    - wrong: What do you do now?
      right: What are you doing now?
      why:
        en: "For right now, use am, is or are + -ing; in Persian the same verb does both."
        fa: "برای کاری که همین الان در جریان است، حتماً از am/is/are + ing استفاده کنید؛ برخلاف فارسی که ممکن است یک شکل فعل را برای هر دو به کار ببریم."
    - wrong: I come to your house tomorrow.
      right: I'm coming to your house tomorrow.
      why:
        en: "For a plan already made, use am, is or are + -ing."
        fa: "برای برنامه‌ها و قرارهای قطعیِ آینده، در انگلیسی به‌جای زمان حال ساده از حال استمراری (am/is/are + ing) استفاده می‌شود."
  contrast:
    - term: do / does + verb (present simple)
      example: I read every night.
      why:
        en: "The present simple is for habits; the -ing form is for now."
        fa: "زمان حال ساده برای عادت‌ها و کارهای تکراری و همیشگی است؛ اما شکل ingدار (استمراری) برای همین لحظه یا برنامه‌های خاص است."
      point: present-simple-questions
    - term: be going to + verb
      example: I'm going to visit my grandma.
      why:
        en: "Both tell plans; -ing is an arrangement with a time, going to an intention."
        fa: "هر دو برای صحبت دربارهٔ آینده هستند؛ اما حال استمراری (ing) معمولاً نشان‌دهندهٔ یک قرارِ قطعی و تنظیم‌شده است، در حالی که going to بیشتر بیانگر یک قصد و نیتِ درونی است."
      point: be-going-to
exercises:
  - id: doing-now
    kind: choose
    sentence: What ___ you doing now?
    options:
      - are
      - do
      - is
    answer: are
    why:
      en: "Now: are + you + -ing."
      fa: "برای سؤال پرسیدن در زمان حال با ضمیر you: از are استفاده می‌شود."
  - id: what-you-doing
    kind: fix
    wrong: What you doing?
    right:
      - What are you doing?
    why:
      en: Are is needed before you.
      fa: وجود فعل are پیش از you در ساختار حال استمراری الزامی است."
  - id: london-next-week
    kind: rewrite
    instruction:
      en: Say the plan with -ing.
      fa: این برنامهٔ آینده را با استفاده از زمان حال استمراری (-ing) بیان کنید.
    from: "Our plan: we go to London next week."
    answers:
      - We're going to London next week.
      - We are going to London next week.
    why:
      en: "An arranged plan: are + -ing."
      fa: "برای برنامه‌های قطعیِ از‌پیش‌تعیین‌شده: are + فعل ingدار."