id: second-conditional
title: { en: "If + past, … would + verb", fa: "شرطی نوع دوم (اگر + گذشته، would)" }
# What a learner may search it by, in English and Persian.
keywords: ["second conditional", "if", "would", "شرطی نوع دوم", "اگر", "خیالی"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  goal: if
topic: conditions_wishes
cefrj: ["215", "215-1"]
match:
  - form: past
    tree:
      word: { DEP: advcl, TAG: VBD }
      has: [ { DEP: mark, LOWER: if } ]
      head:
        word: {}
        has: [ { DEP: aux, LOWER: { IN: [would, "'d", could, might] } } ]
        # would have + past participle is the third conditional.
        lacks: [ { DEP: aux, LOWER: { IN: [have, "'ve", ve] } } ]
  # if + didn't + verb: I wouldn't say it if I didn't mean it.
  - form: past-not
    tree:
      word: { DEP: advcl, TAG: VB }
      has:
        - { DEP: mark, LOWER: if }
        - { DEP: aux, LOWER: did }
        - { DEP: neg }
      head:
        word: {}
        has: [ { DEP: aux, LOWER: { IN: [would, "'d", could, might] } } ]
        lacks: [ { DEP: aux, LOWER: { IN: [have, "'ve", ve] } } ]
  - form: could
    tree:
      word: { DEP: advcl, TAG: VB }
      has:
        - { DEP: mark, LOWER: if }
        - { DEP: aux, LOWER: could }
      head:
        word: {}
        has: [ { DEP: aux, LOWER: { IN: [would, "'d"] } } ]
        lacks: [ { DEP: aux, LOWER: { IN: [have, "'ve", ve] } } ]
tests:
  words: [if]
  match:
    - "If I had money, I'd buy it."
    - "I'd buy it if I had money."
    - "If I were you, I would call her."
    - "What would you do if you won?"
    - "If you could fly, where would you go?"
    - "I wouldn't think it if I didn't mean it."
    - "If you didn't help me, I would fail."
  no_match:
    - "If you were there, you saw it."
    - "If it rains, we'll stay home."
    - "If I'd known, I would have come."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), or Bembegoo's
# guides' where no item has it (guides).
level: A2
level_from: egp
note:
  gist:
    en: "If + the past, … would + a verb: something imagined, or not true now, and what would happen then."
    fa: "ترکیب if به‌علاوهٔ زمان گذشته، و سپس would به‌علاوهٔ فعل ساده: برای بیان فرض‌های خیالی، آرزوها یا شرایطی که در زمان حال حقیقت ندارند و فرض می‌کنیم اگر اتفاق می‌افتاد چه می‌شد (شرطی نوع دوم)."
  forms:
    - kind: positive
      text: If I had more time, I'd learn the piano.
      mark: "If I had more time, I'd learn"
    - kind: negative
      text: If it wasn't so cold, we'd go out.
      mark: "If it wasn't so cold, we'd go"
    - kind: question
      text: What would you do if you won a lot of money?
      mark: would you do if you won
  mistakes:
    - wrong: If I would have money, I would buy it.
      right: If I had money, I would buy it.
      why:
        en: "No would in the if part: use the past."
        fa: "در بخشِ دارای if هرگز از would استفاده نکنید و به‌جای آن فعل را به زمان گذشته ببرید (برخلاف زبان فارسی که در هر دو بخش می‌گوییم «اگر داشتم، می‌خریدم»)."
    - wrong: If I knew his number, I will call him.
      right: If I knew his number, I would call him.
      why:
        en: "With if + past, the other part takes would, not will."
        fa: "وقتی بخشِ شرط گذشته است (if + past)، بخشِ نتیجه باید با would بیاید، نه با will."
    - wrong: If I would be you, I'd say yes.
      right: If I were you, I'd say yes.
      why:
        en: "After if, use were or was, not would be."
        fa: "بعد از کلمهٔ if در جملات فرضی، از were یا was استفاده کنید، نه would be (مثل If I were you)."
  contrast:
    - term: If + present, … will + verb
      example: If it rains, I'll stay home.
      why:
        en: "If + present is a real possibility; if + past is imagined or not true now."
        fa: "شرطی نوع اول (if + حال) برای احتمالِ واقعی و عملی در آینده است؛ اما شرطی نوع دوم (if + گذشته) برای تصورات خیالی و غیرواقعی در زمان حال است."
    - term: would have + past participle
      example: If I had known, I would have come.
      why:
        en: "That one is about the past: something that didn't happen."
        fa: "این ساختار (شرطی نوع سوم) مربوط به زمان گذشته است و از اتفاقی صحبت می‌کند که در گذشته رخ نداده و پرونده‌اش بسته شده است."
      point: would-have-past-participle
exercises:
  - id: if-i-had
    kind: choose
    sentence: "If I ___ more time, I'd learn to play the piano."
    options:
      - had
      - have
      - will have
    answer: had
    why:
      en: "Not true now: if + past, would + verb."
      fa: "برای شرایط غیرواقعی در زمان حال: if + گذشته (had)، بعد would + فعل ساده."
  - id: i-will-call
    kind: fix
    wrong: "If I knew his number, I will call him."
    right:
      - "If I knew his number, I would call him."
      - "If I knew his number, I'd call him."
    why:
      en: "With if + past, the other half takes would."
      fa: "در جملات شرطی نوع دوم، بخش نتیجه هماهنگ با گذشتهٔ بخشِ شرط باید با would بیاید."
  - id: not-rich
    kind: rewrite
    instruction:
      en: "Say what you would do, with if … would."
      fa: "این وضعیت غیرواقعی را با استفاده از ساختار شرطی نوع دوم (if ... would) بیان کنید."
    from: "I'm not rich, so I don't travel much."
    answers:
      - "If I were rich, I'd travel more."
      - "If I were rich, I would travel more."
      - "If I was rich, I'd travel more."
      - "If I was rich, I would travel more."
    why:
      en: "Not true now: if + past (were), then would + verb."
      fa: "برای بیان آرزو یا فرضِ خلافِ واقع در زمان حال: if + گذشته (were/was)، سپس would + فعل ساده."