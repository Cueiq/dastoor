id: past-simple-questions
title: { en: "Did + subject + verb?", fa: "سؤال در گذشتهٔ ساده (Did …?)" }
# What a learner may search it by, in English and Persian.
keywords: ["did", "past simple question", "گذشتهٔ ساده", "ماضی ساده", "سؤال"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  timeline: { row: once, when: past }
  goal: ask
topic: questions
cefrj: ["65-2", "65-3"]
match:
  - form: all
    tokens:
      - { LOWER: { IN: [did, "didn't"] } }
      - { LOWER: "n't", OP: "?" }
      - { TAG: { IN: [DT, "PRP$"] }, OP: "?" }
      # What did your last slave die of?
      - { POS: ADJ, OP: "*" }
      - { POS: { IN: [PRON, PROPN, NOUN] } }
      # So do you still want…?
      - { POS: ADV, OP: "*" }
      - { TAG: VB }
tests:
  words: [did, "didn't"]
  match:
    - "Did you see that?"
    - "What did he say?"
    - "Didn't you hear me?"
    - "Did your dad call?"
    - "What did your last slave die of?"
  no_match:
    - "I did it."
    - "You didn't tell me."
    - "Do you like it?"

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), CEFR-J's own
# (cefrj), or a course guide's where no item has one (guides).
level: A2
level_from: egp
note:
  gist:
    en: 'Did + the person + a plain verb, for a question about the past: Did you see that? Where did you go?'
    fa: 'استفاده از did و سپس فاعل (شخص) به‌علاوهٔ فعل ساده، برای پرسیدن سؤال دربارهٔ زمان گذشته است: Did you see that? (آن را دیدی؟) و Where did you go? (کجا رفتی؟).'
  forms:
    - kind: question
      text: Did you see Ali?
      mark: Did you see
    - kind: question
      text: Where did you go?
      mark: did you go
    - kind: question
      text: Why didn't you come?
      mark: didn't you come
  mistakes:
    - wrong: How did he guessed?
      right: How did he guess?
      why:
        en: "After did, the verb has no -ed: did already says it's past."
        fa: "بعد از did فعل اصلی هرگز ed نمی‌گیرد؛ چون خودِ did به‌تنهایی نشان می‌دهد که جمله در زمان گذشته است."
    - wrong: Where you went?
      right: Where did you go?
      why:
        en: A question about the past needs did before the person.
        fa: "برای سؤالی کردن در زمان گذشته، حتماً باید قبل از شخص (فاعل) فعل کمکی did بیاورید."
    - wrong: Did she went home?
      right: Did she go home?
      why:
        en: 'After did comes the plain verb: go, not went.'
        fa: "همیشه بعد از did فعل به‌صورت ساده می‌آید: بنابراین go درست است، نه went (که گذشته است)."
  contrast:
    - term: do / does + subject + verb?
      example: Where do you live?
      why:
        en: Do and does ask about now or always; did about the past.
        fa: "افعال کمکی do و does برای پرسیدن سؤال دربارهٔ زمان حال یا کارهای همیشگی (روزمره) هستند؛ اما did مختص زمان گذشته است."
      point: present-simple-questions
    - term: was / were + subject?
      example: Were you at home?
      why:
        en: 'With be, the question needs no did: Were you…?'
        fa: "افعال was و were (گذشتهٔ am/is/are) خودشان به‌تنهایی سؤالی می‌کنند و برای آن‌ها نیازی به did ندارید: Were you...?"
      point: was-were
exercises:
  - id: buy-yesterday
    kind: choose
    sentence: Why ___ he buy the dress yesterday?
    options:
      - did
      - does
      - was
    answer: did
    why:
      en: 'Yesterday: a question with did.'
      fa: "کلمهٔ yesterday (دیروز) نشان‌دهندهٔ گذشته است؛ پس سؤال با did ساخته می‌شود."
  - id: did-guessed
    kind: fix
    wrong: How did he guessed?
    right:
      - How did he guess?
    why:
      en: After did, the plain verb.
      fa: "بعد از did، فعل باید به‌صورت ساده بیاید."
  - id: bought-dress
    kind: rewrite
    instruction:
      en: Ask what he bought.
      fa: "سؤال بپرسید که او چه چیزی خرید."
    from: Hector bought a dress.
    answers:
      - What did Hector buy?
    why:
      en: What + did + Hector + buy (not bought).
      fa: "فرمول: What + did + Hector + buy (فعل ساده، نه bought)."