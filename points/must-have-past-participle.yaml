id: must-have-past-participle
title: { en: "must have + past participle", fa: "must have + اسم مفعول (حدس دربارهٔ گذشته)" }
# What a learner may search it by, in English and Persian.
keywords: ["must have", "past guess", "deduction", "حتماً بوده", "حدس دربارهٔ گذشته"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  goal: guess
topic: guessing
cefrj: []
match:
  - form: all
    tree:
      word: { TAG: VBN }
      has:
        - { DEP: aux, LOWER: must }
        - { DEP: aux, LOWER: { IN: [have, "'ve", ve] } }
tests:
  words: [must]
  match:
    - "She must have left early."
    - "You must've been tired."
    - "They must have known."
    - "It must have been a mistake."
  no_match:
    - "You must have a ticket."
    - "You must be tired."
    - "We must leave now."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), or Bembegoo's
# guides' where no item has it (guides).
level: B1
level_from: guides
note:
  gist:
    en: Must have + a past participle, for a guess about the past that you're almost sure of.
    fa: ترکیب must have به‌علاوهٔ اسم مفعول (قسمت سوم فعل)، برای زمانی است که می‌خواهید دربارهٔ اتفاقی در گذشته یک حدسِ تقریباً مطمئن بزنید؛ معادلِ «حتماً ... بوده» در فارسی.
  forms:
    - kind: positive
      text: She must have left early.
      mark: must have left
    - kind: negative
      text: He can't have seen us.
      mark: can't have seen
  mistakes:
    - wrong: She must left early.
      right: She must have left early.
      why:
        en: A guess about the past needs have + past participle after must.
        fa: برای حدس زدن دربارهٔ گذشته، بعد از must باید حتماً have و سپس اسم مفعول (قسمت سوم فعل) بیاید.
    - wrong: You must have called me yesterday, but you didn't.
      right: You should have called me yesterday, but you didn't.
      why:
        en: Must have is a sure guess; for something right that didn't happen, use should have.
        fa: ترکیب must have نشان‌دهندهٔ یک «حدس مطمئن» است؛ اما برای کاری که در گذشته درست بود انجام شود ولی انجام نشد (سرزنش/توصیه در گذشته)، از should have استفاده کنید. (هرچند در فارسی هر دو ممکن است «باید» ترجمه شوند).
    - wrong: He must have forget his keys.
      right: He must have forgotten his keys.
      why:
        en: After must have comes the past participle.
        fa: بعد از must have باید از اسم مفعول (قسمت سوم فعل) استفاده کنید.
  contrast:
    - term: may have + past participle
      example: She may have left early.
      why:
        en: May have is only a possible guess; must have means you are almost sure.
        fa: ترکیب may have فقط یک احتمال ضعیف است (شاید رفته باشد)؛ اما must have به این معنی است که شما تقریباً مطمئن هستید (حتماً رفته است).
      point: may-have-past-participle
    - term: must be (a guess about now)
      example: She must be at home.
      why:
        en: Must be is a guess about now; must have been is a guess about before.
        fa: عبارت must be حدسی دربارهٔ زمان حال است (حتماً الان خانه است)؛ اما must have been حدسی دربارهٔ زمان گذشته است (حتماً آن موقع خانه بوده است).
      point: must-guess
exercises:
  - id: lights-off
    kind: choose
    sentence: The lights are off. They ___ to bed early.
    options:
      - must have gone
      - must go
      - must have go
    answer: must have gone
    why:
      en: 'A sure guess about the past: must have + past participle.'
      fa: 'حدس مطمئن دربارهٔ گذشته: must have + اسم مفعول.'
  - id: must-have-went
    kind: fix
    wrong: She must have went home.
    right:
      - She must have gone home.
    why:
      en: The past participle of go is gone.
      fa: اسم مفعول (قسمت سومِ) فعل go می‌شود gone.
  - id: sure-she-left
    kind: rewrite
    instruction:
      en: Say it as a sure guess, with must have.
      fa: این جمله را به‌صورت یک حدسِ مطمئن و با must have بیان کنید.
    from: I'm sure she left early.
    answers:
      - She must have left early.
    why:
      en: 'A sure guess about the past: must have + left.'
      fa: 'تبدیل مطمئن بودن در گذشته به حدس قوی: must have + left.'