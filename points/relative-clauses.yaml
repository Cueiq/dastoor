id: relative-clauses
title: { en: "who / which / that (the man who lives…)", fa: "جملهٔ موصولی با who، which، that" }
# What a learner may search it by, in English and Persian.
keywords: ["relative clause", "who", "which", "that", "جملهٔ موصولی", "ضمیر موصولی", "که"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  goal: report
topic: linking
cefrj: ["172", "173", "174", "175", "177", "178", "179"]
match:
  - form: pronoun
    tree:
      word: { DEP: relcl }
      has: [ { LOWER: { IN: [who, which, that, whom] }, DEP: { IN: [nsubj, nsubjpass, dobj, pobj, attr] } } ]
  # the man whose car…
  - form: whose
    tree:
      word: { DEP: relcl }
      has:
        - word: {}
          has: [ { LOWER: whose } ]
  # the money you've got: no who, which or that.
  - form: omitted
    tree:
      word: { DEP: relcl, POS: { IN: [VERB, AUX] } }
      has: [ { DEP: { IN: [nsubj, nsubjpass] }, LOWER: { NOT_IN: [who, which, that, whom, what] } } ]
      lacks:
        - { LOWER: { IN: [who, which, that, whom, whose, where, when, why, what, how] } }
        - { DEP: mark }
      head:
        word: { POS: { IN: [NOUN, PRON, PROPN] } }
exclude:
  # Whose dog has Nick found?: a question.
  - tokens: [ { LOWER: whose, IS_SENT_START: true } ]
tests:
  words: [who, which, that]
  match:
    - "A chicken that is kept in a small box."
    - "The man who lives next door is a doctor."
    - "This is the book which I told you about."
    - "Is that all the money you've got?"
    - "The girl I met yesterday called me."
    - "I know a woman whose son is a pilot."
  no_match:
    - "Who are you?"
    - "Whose dog has Nick found?"
    - "I think that he's right."
    - "Which one do you want?"
    - "I know where he lives."
    - "That's the place where we met."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), CEFR-J's own
# (cefrj), or a course guide's where no item has one (guides).
level: A2
level_from: egp
note:
  gist:
    en: "Who for people, which for things, that for either, to say which one you mean: the man who lives next door. When it is the object of what follows, you can leave it out: the film (that) I saw."
    fa: "استفاده از who برای افراد، which برای اشیاء و that برای هر دو، جهت مشخص کردن اینکه دقیقا دربارهٔ چه کسی یا چه چیزی صحبت می‌کنیم: the man who lives next door (مردی که در خانهٔ مجاور زندگی می‌کند). همچنین اگر ضمیر موصولی مفعولِ جملهٔ بعد باشد، می‌توان آن را حذف کرد: the film (that) I saw (فیلمی که دیدم)."
  forms:
    - kind: positive
      text: The man who lives next door is a doctor.
      mark: who lives
    - kind: positive
      text: Is that all the money you've got?
      mark: money you've got
    - kind: negative
      text: It's a shop that doesn't open on Sundays.
      mark: that doesn't open
    - kind: question
      text: Who's the girl that called you?
      mark: that called
  mistakes:
    - wrong: The man who he lives next door is a doctor.
      right: The man who lives next door is a doctor.
      why:
        en: "Who already stands for him: don't add he."
        fa: "ضمیر موصولی who خودش جایگزین فاعل می‌شود؛ بنابراین نباید بعد از آن دوباره ضمیر he را تکرار کنید (برخلاف زبان فارسی که می‌گوییم «مردی که او...»)."
    - wrong: The book what I read was good.
      right: The book that I read was good.
      why:
        en: "After a noun, use that or which, not what."
        fa: "برای اتصال به اسم پیش از آن، باید از that یا which استفاده کنید، نه از what."
    - wrong: The girl which I met is French.
      right: The girl who I met is French.
      why:
        en: "For people, who or that."
        fa: "برای افراد (اشخاص) باید از who یا that استفاده کرد، نه which."
  contrast:
    - term: who / which in a question
      example: Who are you?
      why:
        en: "That asks; a relative clause tells which one."
        fa: "کلماتی مثل who و which در ابتدای جمله برای «پرسیدن سؤال» هستند، اما در جملات موصولی برای توصیف و مشخص کردنِ «کدام‌یک» به کار می‌روند."
      point: null
    - term: where for a place
      example: That's the place where we met.
      why:
        en: "For a place, where."
        fa: "برای اشاره به مکان‌ها در جملات موصولی از where استفاده می‌شود."
      point: null
exercises:
  - id: whose-son
    kind: choose
    sentence: "I know a woman ___ son is a pilot."
    options:
      - whose
      - who
      - which
    answer: whose
    why:
      en: "whose: her son."
      fa: "برای نشان دادن مالکیت (پسرِ آن زن) از whose استفاده می‌شود."
  - id: who-called
    kind: fix
    wrong: "The man who he called me is my uncle."
    right:
      - "The man who called me is my uncle."
      - "The man that called me is my uncle."
    why:
      en: "Who is the subject: no he."
      fa: "از آنجا که who نقش فاعل را دارد، نیازی به آوردن ضمیر اضافی he نیست."
  - id: friend-who
    kind: rewrite
    instruction:
      en: "Join them with who."
      fa: "این دو جمله را با استفاده از who به هم متصل کنید."
    from: "I have a friend. She speaks five languages."
    answers:
      - "I have a friend who speaks five languages."
      - "I have a friend that speaks five languages."
    why:
      en: "who + verb, for a person."
      fa: "برای توصیف شخص: who + فعل."