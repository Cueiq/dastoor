id: can
title: { en: "can / can't + verb", fa: "can (توانستن، اجازه و درخواست)" }
# What a learner may search it by, in English and Persian.
keywords: ["can", "can't", "cannot", "ability", "permission", "request", "توانستن", "می‌توانم", "اجازه", "درخواست"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  goal: able
topic: ability
cefrj: ["123", "123-1", "123-2", "123-3"]
# One note for can and its uses: ability, permission, a request, a
# possibility (owner, 2026-10-22). The guides taught ability alone.
aliases: [can-ability]
match:
  - form: all
    tree:
      word: { TAG: VB }
      has: [ { DEP: aux, LOWER: { IN: [can, ca, cannot, "can't"] } } ]
      lacks:
        # can't have + past participle is a guess about the past.
        - { DEP: aux, LOWER: { IN: [have, "'ve", ve] } }
        - { DEP: auxpass }
  # can + be + -ing: what may be going on, or what will be.
  - form: be-ing
    tree:
      word: { TAG: VBG }
      has:
        - { DEP: aux, LOWER: { IN: [can, ca, cannot, "can't"] } }
        - { DEP: aux, LEMMA: be }
tests:
  words: [can, "can't", cannot]
  match:
    - "I can swim."
    - "She can't drive."
    - "Can you speak English?"
    - "I cannot believe it."
    - "This can't be happening."
  no_match:
    - "He can't have seen us."
    - "It can be fixed."
    - "I could swim."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), CEFR-J's own
# (cefrj), or Bembegoo's guides' where no item has one (guides).
level: A1
level_from: egp
note:
  gist:
    en: 'Can or can''t + a plain verb: what someone is able to do (I can swim), what is allowed (You can go now), or a request (Can you help me?).'
    fa: 'فعل کمکی can (یا حالت منفی آن can''t) به‌علاوهٔ فعل ساده، برای بیان کاری است که کسی بلد است یا از عهده‌اش برمی‌آید (I can swim)، اجازه‌اش را دارد (You can go now) یا برای مطرح کردن یک درخواست (Can you help me?).'
  forms:
    - kind: positive
      text: I can swim.
      mark: can swim
    - kind: negative
      text: She can't cook.
      mark: can't cook
    - kind: question
      text: Can you help me?
      mark: Can you help
  mistakes:
    - wrong: I can to speak English.
      right: I can speak English.
      why:
        en: After can comes the plain verb, with no to.
        fa: بعد از can حتماً فعل ساده می‌آید؛ از to استفاده نکنید.
    - wrong: He cans swim.
      right: He can swim.
      why:
        en: Can never takes -s.
        fa: فعل can هیچ‌وقت حرف s (سوم‌شخص) نمی‌گیرد، حتی برای he و she.
    - wrong: Do you can swim?
      right: Can you swim?
      why:
        en: To ask, put can first; don't use do.
        fa: در سؤال پرسیدن با این فعل، خود can را اول جمله بیاورید و نیازی به فعل کمکی do نیست.
  contrast:
    - term: could + verb
      example: I could swim when I was five.
      why:
        en: Could is can in the past, and a politer way to ask.
        fa: کلمهٔ could زمان گذشتهٔ can است و البته راهی مؤدبانه‌تر برای درخواست کردن.
      point: could
    - term: must + verb
      example: You must wear a seatbelt.
      why:
        en: Can is allowed; must is necessary.
        fa: کلمهٔ can یعنی شما اجازه دارید؛ اما must یعنی شما مجبور هستید و واجب است.
      point: must-obligation
exercises:
  - id: can-swim
    kind: choose
    sentence: ___ you swim?
    options:
      - Can
      - Do you can
      - Are
    answer: Can
    why:
      en: 'A question: can first.'
      fa: 'چون جمله سؤالی است، can در اول می‌آید.'
  - id: can-to-cook
    kind: fix
    wrong: She can to cook very well.
    right:
      - She can cook very well.
    why:
      en: No to after can.
      fa: بعد از can کلمهٔ to قرار نمی‌گیرد.
  - id: not-able
    kind: rewrite
    instruction:
      en: Say it with can't.
      fa: با can't بگویید.
    from: I am not able to swim.
    answers:
      - I can't swim.
      - I cannot swim.
    why:
      en: 'Not able: can''t + verb.'
      fa: 'جایگزین عدم توانایی در کاری: can''t + فعل ساده.'