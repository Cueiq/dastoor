id: present-simple-questions
title: { en: "Do / Does + subject + verb?", fa: "سؤال در حال ساده (Do / Does …?)" }
# What a learner may search it by, in English and Persian.
keywords: ["do", "does", "present simple question", "حال ساده", "سؤال"]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  timeline: { row: once, when: now }
  goal: ask
topic: questions
cefrj: ["59-2", "59-3", "60-2", "60-3"]
# Known false match: "Don't you worry." is an order, told from "Don't you
# see?" only by its stop.
match:
  - form: all
    tokens:
      - { LOWER: { IN: [do, does, "don't", "doesn't"] } }
      - { LOWER: "n't", OP: "?" }
      - { TAG: { IN: [DT, "PRP$"] }, OP: "?" }
      - { POS: ADJ, OP: "*" }
      - { POS: { IN: [PRON, PROPN, NOUN] } }
      # So do you still want…?
      - { POS: ADV, OP: "*" }
      - { TAG: VB }
  # Does any of this make sense?
  - form: of
    tokens:
      - { LOWER: { IN: [do, does, "don't", "doesn't"] } }
      - { LOWER: "n't", OP: "?" }
      - { LOWER: { IN: [any, all, some, none, each, either, neither] } }
      - { LOWER: of }
      - { POS: { IN: [PRON, DET, NOUN, PROPN] } }
      # After does, a present the parser reads is the base form.
      - { TAG: { IN: [VB, VBP] } }
  # Do you wanna…?
  - form: wanna
    tokens:
      - { LOWER: { IN: [do, does, "don't", "doesn't"] } }
      - { LOWER: "n't", OP: "?" }
      - { POS: { IN: [PRON, PROPN] } }
      - { LOWER: wanna }
      - { TAG: VB }
exclude:
  # Don't you say a word.: an order with its subject, not a question.
  - tokens:
      - { LOWER: { IN: [do, "don't"] }, IS_SENT_START: true }
      - { LOWER: "n't", OP: "?" }
      - { LOWER: you }
      - { IS_PUNCT: false, OP: "*" }
      - { LOWER: "." }
tests:
  words: [do, does, "don't", "doesn't"]
  match:
    - "Do you like it?"
    - "Does your mom know?"
    - "What do you do?"
    - "Where does he live?"
    - "Don't you see?"
    - "So do you still want to be a waiter?"
    - "What does any of this have to do with me?"
    - "What do you wanna apologize for?"
  no_match:
    - "I do like it."
    - "Do it now."
    - "Did you see that?"
    - "I don't know."
    - "Don't you say a word."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), CEFR-J's own
# (cefrj), or a course guide's where no item has one (guides).
level: A1
level_from: cefrj
note:
  gist:
    en: "Do or does + the person + a plain verb, for a question in the present simple: Do you like cats? Where does he work?"
    fa: "استفاده از do یا does در ابتدای جمله و پیش از فاعل (شخص)، به‌علاوهٔ فعل ساده، برای ساختن جملات پرسشی در زمان حال ساده است: Do you like cats? (گربه‌ها را دوست داری؟) و Where does he work? (او کجا کار می‌کند؟)."
  forms:
    - kind: question
      text: Do you like cats?
      mark: Do you like
    - kind: question
      text: Where does he work?
      mark: does he work
    - kind: question
      text: Why don't you like fish?
      mark: don't you like
  mistakes:
    - wrong: Where you live?
      right: Where do you live?
      why:
        en: "A question in the present simple needs do or does before the person."
        fa: "برای پرسی سوالی در زمان حال ساده، حتماً پیش از شخص (فاعل) به فعل کمکی do یا does نیاز داریم."
    - wrong: Does he likes tea?
      right: Does he like tea?
      why:
        en: "After does, the verb has no -s."
        fa: "وقتی از does استفاده می‌کنید، فعل اصلی جمله دیگر نباید پسوند s یا es بگیرد (فعل به صورت ساده می‌آید)."
    - wrong: Do she like pizza?
      right: Does she like pizza?
      why:
        en: "He, she and it take does, not do."
        fa: "ضمایر سوم‌شخص مفرد (he، she، it) با does سؤالی می‌شوند، نه با do."
  contrast:
    - term: did + subject + verb?
      example: Where did you go?
      why:
        en: "Did asks about the past; do and does about now or always."
        fa: "فعل کمکی did برای پرسیدن دربارهٔ زمان گذشته است، اما do و does برای حال یا کارهای همیشگی به کار می‌روند."
      point: past-simple-questions
    - term: am / is / are + subject + verb-ing?
      example: What are you doing?
      why:
        en: "That asks about right now; do you do asks about usually."
        fa: "ساختار am/is/are دربارهٔ همین لحظه می‌پرسد، در حالی که حال ساده (با do/does) دربارهٔ کارهای همیشگی و روتین است."
      point: present-continuous
exercises:
  - id: annie-pizza
    kind: choose
    sentence: "___ Annie like pizza?"
    options:
      - Does
      - Do
      - Is
    answer: Does
    why:
      en: "Annie is she: does."
      fa: "نام Annie معادل ضمیر she (سوم‌شخص مفرد) است؛ بنابراین با does سؤالی می‌شود."
  - id: where-you-work
    kind: fix
    wrong: "Where you work?"
    right:
      - "Where do you work?"
    why:
      en: "The question needs do before you."
      fa: "در ساختار پرسشی حال ساده، قبل از ضمیر you باید از do استفاده شود."
  - id: hector-tea
    kind: rewrite
    instruction:
      en: "Ask about it with does."
      fa: "با استفاده از does این جمله را به شکل پرسشی درآورید."
    from: "Hector likes tea."
    answers:
      - "Does Hector like tea?"
    why:
      en: "Does + he + the plain verb: like, not likes."
      fa: "فرمول پرسشی: does + فاعل + فعل ساده (like بدون s)."