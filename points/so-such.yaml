id: so-such
title: { en: "so + adjective, such (a) + noun (so tired, such a mess)", fa: "so و such برای تأکید (so tired، such a mess)" }
# What a learner may search it by, in English and Persian.
keywords: ["so", "such", "so ... that", "such a", "خیلی", "آن‌قدر", "چنان"]
# The ids guides gave the same point.
aliases: [such-a]
# Where a book shows it beyond its topic: on the tenses' timeline, and
# under what a learner wants to do with a sentence.
place:
  goal: emphasise
topic: comparing
cefrj: ["45", "46", "47"]
match:
  - form: so
    tree:
      word: { POS: { IN: [ADJ, ADV] }, LOWER: { NOT_IN: [much, many, far, long, little, few] } }
      has: [ { DEP: advmod, LOWER: so } ]
  # so good-looking: the subtitle's hyphen splits the word.
  - form: hyphen
    tokens: [ { LOWER: so }, { POS: ADJ }, { TEXT: "-" }, { POS: { IN: [ADJ, VERB, NOUN] } } ]
  - form: hyphen
    tokens: [ { LOWER: so }, { TEXT: { REGEX: "^[a-z]+-$" } }, { POS: { IN: [ADJ, VERB, NOUN] } } ]
  - form: such
    tree:
      word: { POS: NOUN }
      has: [ { DEP: { IN: [amod, predet, det] }, LOWER: such } ]
exclude:
  # So, back to work?: so opening the sentence, not before an adjective.
  - tokens: [ { LOWER: so }, { IS_PUNCT: true } ]
  # So far, so good: a fixed phrase.
  - tokens: [ { LOWER: so }, { LOWER: far }, { IS_PUNCT: true, OP: "?" }, { LOWER: so }, { LOWER: good } ]
  # such as: an example, not emphasis.
  - tokens: [ { LOWER: such }, { LOWER: as } ]
tests:
  words: [so, such]
  match:
    - "I'm so tired."
    - "It was such a mess."
    - "She's such a nice person."
    - "He talks so fast."
    - "It was so cold that we stayed in."
    - "They are so beautiful in their glass boxes."
    - "You think he's vain. / But he's so good- looking."
  no_match:
    - "So we left."
    - "I think so."
    - "Thanks so much."
    - "So far, so good."
    - "So, back to screaming?"
    - "I like big cities such as London."

# The learner's note (CC BY-SA 4.0, points/LICENSE.md). level_from: the
# English Grammar Profile's level as CEFR-J records it (egp), CEFR-J's own
# (cefrj), or a course guide's where no item has one (guides).
level: B1
level_from: egp
note:
  gist:
    en: "So + an adjective or adverb, such (a) + a noun, to make it stronger: so tired, such a mess. Often with that and what came of it: so cold that we stayed in."
    fa: "استفاده از so پیش از صفت یا قید، و such (یا such a) پیش از اسم، برای ایجاد تأکید و شدت‌بخشیدن به کلام (معادل «آن‌قدر»، «چنان» یا «خیلی» در فارسی): so tired (خیلی خسته) و such a mess (عجب وضع آشفته‌ای). این ساختار اغلب همراه با that برای بیان یک «نتیجه» به کار می‌رود."
  forms:
    - kind: positive
      text: I'm so tired.
      mark: so tired
    - kind: positive
      text: It was such a mess.
      mark: such a mess
    - kind: negative
      text: It's not such a bad world.
      mark: such a bad world
    - kind: question
      text: Why are you so angry?
      mark: so angry
  mistakes:
    - wrong: It was so a good film.
      right: It was such a good film.
      why:
        en: "Before a or a noun, use such, not so."
        fa: "وقتی کلمهٔ a/an یا یک اسم در جمله حضور دارد، باید از such استفاده کنید، نه so."
    - wrong: She is such kind.
      right: She is so kind.
      why:
        en: "Before an adjective alone, use so."
        fa: "قبل از صفتِ تنها (بدون اسم در ادامه)، حتماً از so استفاده کنید."
    - wrong: I'm very tired that I can't walk.
      right: I'm so tired that I can't walk.
      why:
        en: "With that and a result, use so, not very."
        fa: "وقتی می‌خواهید نتیجهٔ کاری را با کلمهٔ that در ادامه بیان کنید، باید از so استفاده کنید (so ... that)، نه از very."
  contrast:
    - term: too + adjective
      example: It's too cold to swim.
      why:
        en: "Too means more than is good; so only makes it stronger."
        fa: "کلمهٔ too به معنای «بیش از اندازه و به طور منفی» است (تا حدی که مانع انجام کاری شود)؛ اما so فقط برای تأکید و شدت بخشیدن به کار می‌رود."
      point: too-adjective
    - term: very + adjective
      example: It's very cold.
      why:
        en: "Very makes it stronger too, but takes no that after it."
        fa: "فعل very هم برای تأکید است، اما برخلاف so، نمی‌تواند در ساختارِ نتیجه‌گیری با that قرار بگیرد."
      point: null
exercises:
  - id: such-nice
    kind: choose
    sentence: "She's ___ a nice person."
    options:
      - such
      - so
      - very
    answer: such
    why:
      en: "such + a + noun."
      fa: "فرمول حضور اسم به همراه حرف تعریف a: کلمهٔ such."
  - id: such-long
    kind: fix
    wrong: "It was so a long day."
    right:
      - "It was such a long day."
    why:
      en: "Before a, use such."
      fa: "قبل از حرف تعریف a، استفاده از such الزامی است."
  - id: so-cold-that
    kind: rewrite
    instruction:
      en: "Join them with so … that."
      fa: "این دو جمله را با استفاده از ساختار so ... that به هم متصل کنید."
    from: "It was very cold. We stayed at home."
    answers:
      - "It was so cold that we stayed at home."
      - "It was so cold we stayed at home."
    why:
      en: "so + adjective + that + what came of it."
      fa: "ساختار نتیجه‌گیری: so + صفت + that + جملهٔ نتیجه."